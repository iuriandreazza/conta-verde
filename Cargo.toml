[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/iuriandreazza/conta-verde"
publish = false

[workspace.dependencies]
axum = "0.8"
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "migrate", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4", "serde"] }

conta-verde-domain = { path = "crates/domain" }
conta-verde-application = { path = "crates/application" }
conta-verde-infrastructure = { path = "crates/infrastructure" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
