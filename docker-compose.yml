services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: conta_verde
      POSTGRES_PASSWORD: conta_verde
      POSTGRES_DB: conta_verde
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Creates the role the server serves requests as, on a database's first start (an existing volume: run the file
      # by hand or `docker compose down -v`, ADR 0093).
      - ./deploy/postgres/create-app-role.sql:/docker-entrypoint-initdb.d/10-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conta_verde"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every e-mail the app sends and shows it at http://localhost:8025, so development never
  # mails a real person. SMTP is on 1025 (SMTP_URL=smtp://localhost:1025).
  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "127.0.0.1:${MAIL_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAIL_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
