services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: conta_verde
      POSTGRES_PASSWORD: conta_verde
      POSTGRES_DB: conta_verde
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conta_verde"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
