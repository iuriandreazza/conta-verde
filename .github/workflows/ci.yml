name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The server serves requests as a role that owns nothing, so the row-level policies apply to the tests too (ADR 0093).
  DATABASE_URL: postgres://conta_verde_app:conta_verde_app@localhost:5432/conta_verde
  DATABASE_MIGRATE_URL: postgres://conta_verde:conta_verde@localhost:5432/conta_verde

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: conta_verde
          POSTGRES_PASSWORD: conta_verde
          POSTGRES_DB: conta_verde
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conta_verde"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: psql postgres://conta_verde:conta_verde@localhost:5432/conta_verde -f deploy/postgres/create-app-role.sql
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --workspace -- --ignored
      # The real server and the real HTTP path as the runtime role: the extractor, the gate and the token lookups that narrow the
      # scope (ADR 0093) are only exercised end to end here.
      - name: Smoke the running server under row-level security
        run: |
          cargo build -p conta-verde-api
          ./target/debug/conta-verde &
          for attempt in $(seq 1 60); do
            curl -sf http://127.0.0.1:3100/health && break
            sleep 1
          done
          python3 scripts/e2e-areas.py http://127.0.0.1:3100
          python3 scripts/e2e-accountant.py http://127.0.0.1:3100
        env:
          BIND_ADDR: 127.0.0.1:3100
          CNPJ_LOOKUP: "off"
          PUBLIC_URL: http://localhost:5173
          ATTACHMENTS_DIR: ${{ runner.temp }}/attachments
          PAYMENT_PROVIDER: fake

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter conta-verde-web typecheck
      - run: pnpm --filter conta-verde-web test
      - run: pnpm --filter conta-verde-web build

  # A connector is a separate package with no dependencies: Node 22 and its test runner, nothing to install.
  connectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "test/*.test.js"
        working-directory: connectors/woocommerce
