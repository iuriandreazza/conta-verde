# Publishes the image of a release to ghcr.io when a tag `vX.Y.Z` is pushed (ADR 0096). It needs nothing but the workflow's own
# GITHUB_TOKEN; it never runs for a branch or a pull request. The tag must be the version of the code (Cargo.toml), which
# is what /api/health says, so the image, the tag and the running server cannot disagree.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "the tag $GITHUB_REF_NAME is not a commit of main" >&2; exit 1; }
      - name: The tag is the version of the code
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$tag" != "$code" ]; then
            echo "the tag $GITHUB_REF_NAME is not the version in Cargo.toml ($code)" >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # 1.0.0 and 1.0: never `latest`, so nobody upgrades by pulling.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            VITE_SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
