# The API has no login rate limiting of its own (ADR 0092 leaves it to the proxy): the sign-in, sign-up and password routes
# are limited per client address here. The client is the address the proxy in front reports, trusted only when the
# request comes from a private network (the proxy and the container are on one).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
limit_req_status 429;
limit_req_log_level warn;

server {
    listen 3080;
    root /usr/share/nginx/html;
    client_max_body_size 11m;

    # What lets a person try passwords or flood the mailer: a burst of ten, then 30 a minute.
    location ~ ^/api/(auth/(login|register|password-reset|email-confirmation)|invitations/) {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # The prefix is removed, as the dev server's proxy does.
    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # The worker and the shell are asked about every time: a cached worker would keep an old version of the offline rules alive.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
